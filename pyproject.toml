[project]
name = "pa-agent"
version = "0.1.0"
description = "RAG pipeline for LMU study documents"
requires-python = ">=3.13.1"
dependencies = [
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
extend-exclude = ["irrelevant"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"