[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-for-dotted-charts"
version = "0.1.0"
description = "Fine-tuning Vision-Language Models for Dotted Chart Understanding in Process Mining"
requires-python = ">=3.11"

dependencies = [
    # Deep Learning
    "torch",
    "torchvision",

    # Vision-Language Models and Fine-Tuning
    "transformers",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes",
    "qwen-vl-utils",

    # Data Processing
    "datasets",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
